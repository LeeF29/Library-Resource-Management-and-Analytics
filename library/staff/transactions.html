<!doctype html>
<html lang="en">

<body data-roles="admin,librarian" data-layout="staff" data-active="transactions" data-title="Circulation">

<main id="content">

<div class="page-head">
  
  <div><h2>Circulation desk</h2>
  
    <p>Track borrowing, returns and due dates.</p>

  </div>
  
  <a class="btn btn-gold" href="borrow.html">+ New loan</a>

</div>

<div class="chips" id="chips"></div>

</div>
