<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Catalog · Library System</title>

<link rel="stylesheet" href="../assets/css/style.css">

</head>

<body data-roles="admin,librarian" data-layout="staff" data-active="books" data-title="Catalog">

<main id="content">

<div class="page-head">
  
  <div>
    
    <h2>Manage the catalog</h2>
    <p>Add, edit, search and remove library resources.</p>
  
  </div>
  
  <a class="btn btn-primary" href="book_form.html">+ Add resource</a>

</div>

<div class="searchbar">
  
  <form id="filters" class="filters" autocomplete="off">
    
    <input type="search" name="q" placeholder="Search title, author or ISBN" aria-label="Search">
    <select name="category" id="fCategory" aria-label="Category"></select>

    <select name="type" aria-label="Type">
  
      <option value="">All types</option>
      <option value="book">Book</option>
      <option value="journal">Journal</option>
      <option value="other">Other material</option>

    </select>

    <select name="avail" aria-label="Availability">
  
      <option value="">Any availability</option>
      <option value="available">Available now</option>
      <option value="unavailable">All borrowed</option>

    </select>

    <button class="btn btn-primary" type="submit">Search</button>
    <button class="btn btn-ghost" type="button" id="clear">Clear</button>

  </form>

</div>

<div class="card">
  
  <div id="list"></div>
  <div id="pager"></div>

</div>

</main>

<noscript><p style="padding:1rem">This page needs JavaScript turned on.</p></noscript>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/pages/books.js"></script>

</body>
</html>
